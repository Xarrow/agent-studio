[Service]
# ── 文件系统沙箱 ─────────────────────────────────────────────────────
# 平台层（guardrails）已经拦了"越界读要问、凭据读写硬拦"，但它拦的是它认得的
# 写法：python 里拼出来的路径、bash 里的变量展开都可能绕过去。这一层交给内核：
# 只把这几个目录挂成可写，其余整个文件系统只读；凭据位置直接不可见。
#
# 刻意没有改 User=（还是 root）：这个实例上的助手要能直接改 /srv/src 的源码、
# 跑 git、发布到 /srv/www —— 换成普通用户等于把现有工作流整个打断。
# 沙箱靠"能碰哪些路径"来收，不靠"以谁的身份跑"。
ProtectSystem=strict
ProtectHome=read-only
ReadWritePaths=/srv/src/agent-studio /srv/www /tmp /var/tmp /dev/shm
InaccessiblePaths=-/root/.hermes -/root/.ssh -/root/.aws -/etc/shadow -/etc/gshadow -/etc/sudoers -/etc/sudoers.d

# 家目录挪到工作区里（ProtectHome=read-only 之后 /root 写不了，
# 而浏览器/工具会往 $HOME 里写缓存）
Environment=HOME=/srv/src/agent-studio/data/home

# 内核面收一收（不影响浏览器：Chrome 起的是普通子进程）
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
LockPersonality=yes
