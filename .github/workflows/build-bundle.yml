name: 构建离线一体包

# ============================================================================
#  打包 → 多环境验证 → 验证通过才发布
#
#  全流程跑在 GitHub 云端 runner 上，开发机不参与构建与验证。
#
#  三个 job（层层把关，任一处不过就不发布）：
#
#  build        矩阵双架构打包，并在同机验证
#                 · x86_64 原生跑
#                 · aarch64 走 qemu 模拟（需补交叉 libc/libgcc 供 qemu 使用）
#  verify-multi 用 x86_64 包在多种环境里分别验证
#                 · Ubuntu 22.04 (glibc 2.35) / 24.04 (2.39)  ← runner 原生
#                 · Debian 12 (2.36) / Rocky 9 (2.34)        ← 容器，贴近真实服务器
#                 · Debian 11 (2.31)                          ← 预期被拦下（反向验收）
#  release      仅当 build 与 verify-multi 全部成功，才发布包 + 校验和到 Release
#
#  产物：agent-studio-<日期>-<arch>.tar.gz（顶层目录 agent-studio/）
# ============================================================================
on:
  workflow_dispatch:
    inputs:
      python_version:
        description: '内置 CPython 版本'
        required: false
        default: '3.13.15'
      pbs_tag:
        description: 'python-build-standalone 发布标签'
        required: false
        default: '20260924'
      skip_verify:
        description: '跳过验证（仅打包，不发布）'
        required: false
        type: boolean
        default: false
      publish:
        description: '验证通过后发布到 Release'
        required: false
        type: boolean
        default: true
  push:
    tags:
      - 'bundle-*'

permissions:
  contents: write

env:
  PYV: ${{ inputs.python_version || '3.13.15' }}
  PBS_TAG: ${{ inputs.pbs_tag || '20260924' }}
  PKG: agent-studio

jobs:
  build:
    name: 打包 ${{ matrix.arch }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 构建前端（next build → out/）
        working-directory: web
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install; fi
          npm run build
          test -f out/index.html || { echo "::error::前端未产出 out/index.html"; exit 1; }
          echo "前端产物 $(du -sh out | cut -f1) / $(find out -type f | wc -l) 个文件"

      - uses: astral-sh/setup-uv@v5

      - name: 导出锁定依赖
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes -o requirements-lock.txt
          echo "依赖条目：$(grep -c . requirements-lock.txt)"

      - name: 下载内置 CPython（${{ matrix.arch }}）
        run: |
          set -euo pipefail
          U="https://github.com/astral-sh/python-build-standalone/releases/download/${PBS_TAG}/cpython-${PYV}%2B${PBS_TAG}-${{ matrix.arch }}-unknown-linux-gnu-install_only_stripped.tar.gz"
          echo "下载 $U"
          curl -fL --retry 3 -o pbs.tar.gz "$U"
          mkdir -p "$PKG/runtime/${{ matrix.arch }}/python"
          tar xzf pbs.tar.gz -C "$PKG/runtime/${{ matrix.arch }}" --strip-components=1
          mv "$PKG/runtime/${{ matrix.arch }}/"{bin,lib,include,share} "$PKG/runtime/${{ matrix.arch }}/python/" 2>/dev/null || true
          if [ "${{ matrix.arch }}" = "$(uname -m)" ]; then
            "$PKG/runtime/${{ matrix.arch }}/python/bin/python3" -V
          else
            ELFARCH=$(readelf -h "$PKG/runtime/${{ matrix.arch }}/python/bin/python3.13" | awk -F: '/Machine/{print $2}' | xargs)
            echo "交叉架构：不执行，仅校验 ELF（Machine=$ELFARCH）"
            case "$ELFARCH" in *AArch64*) echo "ELF 架构正确" ;; *) echo "::error::ELF 架构不符"; exit 1 ;; esac
          fi

      - name: 展开依赖到 vendor/${{ matrix.arch }}/site-packages
        run: |
          set -euo pipefail
          SP="$PKG/vendor/${{ matrix.arch }}/site-packages"
          mkdir -p "$SP"
          if [ "${{ matrix.arch }}" = "$(uname -m)" ]; then
            echo "架构一致 → 直接安装"
            "$PKG/runtime/${{ matrix.arch }}/python/bin/python3" -m pip install -q \
              --no-warn-script-location --target "$SP" -r requirements-lock.txt
          else
            echo "交叉架构 → 下载该架构 wheel 后展开（不执行）"
            python3 -m pip install -q --target "$SP" --only-binary=:all: \
              --platform manylinux2014_${{ matrix.arch }} \
              --platform manylinux_2_28_${{ matrix.arch }} \
              --platform manylinux_2_24_${{ matrix.arch }} \
              --platform manylinux_2_17_${{ matrix.arch }} \
              --python-version 3.13 --implementation cp --abi cp313 \
              -r requirements-lock.txt
          fi
          echo "顶层条目 $(ls "$SP" | wc -l)，原生扩展 $(find "$SP" -name '*.so' | wc -l)"

      - name: 组装并打包（顶层目录 agent-studio/）
        run: |
          set -euo pipefail
          mkdir -p "$PKG/app/web"
          cp -a src "$PKG/app/src"
          cp -a web/out "$PKG/app/web/out"
          cp scripts/bundle-start.sh "$PKG/start.sh"
          cp scripts/bundle-README.md "$PKG/README.md"
          cp requirements-lock.txt "$PKG/"
          chmod +x "$PKG/start.sh"
          rm -rf "$PKG/data"
          find "$PKG" -name '__pycache__' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          TAR="agent-studio-$(date +%Y%m%d)-${{ matrix.arch }}.tar.gz"
          tar czf "$TAR" "$PKG"
          gzip -t "$TAR"
          echo "顶层结构：$(tar tzf "$TAR" | head -1)"
          echo "TAR=$TAR" >> "$GITHUB_ENV"
          ls -lh "$TAR"

      - if: matrix.arch == 'aarch64'
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: 同机验证
        if: ${{ !inputs.skip_verify }}
        env:
          # 供 qemu 找 aarch64 的加载器与运行库（真机上这些是系统自带）
          QEMU_LD_PREFIX: /usr/aarch64-linux-gnu
        run: |
          set -uo pipefail
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            if [ ! -e /proc/sys/fs/binfmt_misc/qemu-aarch64 ]; then
              echo "::warning::qemu 未就绪，aarch64 只做结构校验"
              tar tzf "$TAR" | head -8
              exit 0
            fi
            sudo apt-get update -qq
            sudo apt-get install -y -qq libc6-arm64-cross libgcc-s1-arm64-cross libstdc++6-arm64-cross || true
            ls -l /usr/aarch64-linux-gnu/lib/ld-linux-aarch64.so.1 /usr/aarch64-linux-gnu/lib/libgcc_s.so.1 2>/dev/null \
              || echo "::warning::交叉运行库可能不全"
            echo "[i] qemu 模拟执行 aarch64 包（比原生慢）"
            echo "[i] 第一轮：默认方式（走 uvloop）"
            if BUNDLE_ARCH=aarch64 bash scripts/verify-bundle.sh "$TAR" 8848; then
              echo "✅ aarch64 默认方式即通过"
              exit 0
            fi
            echo "::warning::默认方式未通过（日志见上）。改用 --loop asyncio 复验 ——"
            echo "::warning::qemu-user 对 uvloop 依赖的 syscall 支持不全；这一步验证的是包内 aarch64"
            echo "::warning::运行时与原生依赖本身能否工作，uvloop 在真机上的表现需真机确认。"
            UVICORN_EXTRA_ARGS="--loop asyncio" BUNDLE_ARCH=aarch64 bash scripts/verify-bundle.sh "$TAR" 8848
          else
            bash scripts/verify-bundle.sh "$TAR" 8848
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: agent-studio-${{ matrix.arch }}
          path: agent-studio-*.tar.gz
          retention-days: 14

  verify-multi:
    name: 多环境验证 · ${{ matrix.label }}
    needs: build
    # 某一路（如 aarch64）失败也不拖累这一组 —— 它验的是 x86_64 包，那一路是成功的
    if: ${{ always() && !cancelled() && !inputs.skip_verify }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { label: 'Ubuntu 22.04 · glibc 2.35', os: 'ubuntu-22.04', mode: host }
          - { label: 'Ubuntu 24.04 · glibc 2.39', os: 'ubuntu-24.04', mode: host }
          - { label: 'Debian 12 · glibc 2.36',     os: 'ubuntu-latest', mode: docker, image: 'debian:12' }
          - { label: 'Rocky 9 · glibc 2.34',       os: 'ubuntu-latest', mode: docker, image: 'rockylinux:9' }
          - { label: 'Debian 11 · glibc 2.31（预期被拦下）', os: 'ubuntu-latest', mode: docker, image: 'debian:11', expect_blocked: true }
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: agent-studio-x86_64
          path: pkg

      - name: 验证
        run: |
          set -uo pipefail
          TAR="$(ls -1 pkg/*.tar.gz 2>/dev/null | head -1)"
          [ -n "$TAR" ] || { echo "::error::没拿到 x86_64 包（构建那一步可能失败）"; exit 1; }
          echo "包：$TAR（$(du -h "$TAR" | cut -f1)）"
          ARGS=()
          [ "${{ matrix.mode }}" = "docker" ] && ARGS+=(--image "${{ matrix.image }}")
          [ "${{ matrix.expect_blocked }}" = "true" ] && ARGS+=(--expect-blocked)
          bash scripts/verify-in-env.sh "$TAR" "${ARGS[@]}"

  release:
    name: 发布到 GitHub Release
    needs: [build, verify-multi]
    # 发布门禁：所有构建 + 所有环境的验证都成功才发布
    if: >-
      ${{ always()
          && needs.build.result == 'success'
          && needs.verify-multi.result == 'success'
          && !inputs.skip_verify
          && inputs.publish != false }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 生成校验和
        run: |
          cd dist && ls -lh
          sha256sum *.tar.gz | tee SHA256SUMS.txt

      - name: 发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="bundle-$(date +%Y%m%d)-$(git rev-parse --short HEAD)"
          TITLE="Agent Studio 离线一体包 ${TAG}"
          NOTES=$(mktemp)
          cp .github/release-notes.md "$NOTES"
          printf '\n### 校验和\n\n```\n' >> "$NOTES"
          cat dist/SHA256SUMS.txt >> "$NOTES"
          printf '```\n' >> "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE" --notes-file "$NOTES"
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TITLE" --notes-file "$NOTES"
          fi
          gh release view "$TAG" --json url -q .url
